services:
  go-letmesee:
    # build: .
    image: registry.internal/go-letmesee:latest
    restart: unless-stopped
    container_name: letmesee
    #ports:
    #  - "3000:8080"
    volumes:
    - ./config.yaml:/letmesee/config.yaml:ro
    - /mnt/zotero/dictionary/epwing:/mnt/zotero/dictionary/epwing:ro
    networks:
    - traefik_br
    labels:
    - traefik.enable=true
    - traefik.http.routers.go-letmesee.rule=Host(`${COMPOSE_PROJECT_NAME}.app.internal`)
    - traefik.http.services.go-letmesee.loadbalancer.server.port=8080
networks:
  traefik_br:
    external: true
