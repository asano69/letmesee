  encyclopedia:
    - 平凡社_世界大百科事典_第二版:1
    - 小学館_日本大百科全書:1
    - 学研_新世紀ビジュアル百科辞典:1
    - 平凡社_マイペディア98:1
    - 岩波_広辞苑_第六版:1
  japanese:
    - WordNet1.1:1
    - 小学館_日本国語大辞典_精選版:1
    - 三省堂_スーパー大辞林:1
    - 岩波_国語辞典_第六版:1
    - 三省堂_現代国語辞典:1
    - 大修館_明鏡国語辞典:1
    - 岩波_広辞苑_第六版:1
    - 学研_国語大辞典:1
    - 学研_漢字源:1
  english:
    - 研究社_新英和大辞典_第六版:1
    - 大修館_ジーニアス英和:1
    - 大修館_ジーニアス英和第三版_和英第二版:1
    - LDOCE4:1
